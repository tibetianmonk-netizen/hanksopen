name: Update YouTube playlist

on:
  schedule:
    - cron: "0 6 * * *"  # daily, 06:00 UTC (15:00 KST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate playlist section
        run: python3 scripts/update_playlist.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- about.html; then
            echo "No playlist changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add about.html
          git commit -m "Auto-update playlist section in about.html"
          git push
